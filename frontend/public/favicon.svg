<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFA439" />
      <stop offset="50%" stop-color="#E56910" />
      <stop offset="100%" stop-color="#C65507" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#7A2E05" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Circle with Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="2.5" />
  <!-- Inner Subtle Ring -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldBorder)" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.75" />
  <!-- Sacred 'सु' Symbol in Pure White -->
  <text x="32" y="42" font-family="'Cormorant Garamond', 'Noto Sans Devanagari', 'Mangal', 'Segoe UI Historic', 'Arial Unicode MS', serif" font-size="34" font-weight="700" text-anchor="middle" fill="#FFFFFF" filter="url(#shadow)">सु</text>
</svg>